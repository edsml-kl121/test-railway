<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mew starter railway</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <h1>Mew starter railway</h1>
      <p>Enter your name to get a greeting from the backend.</p>
      <form id="greeting-form" action="/api/greet" method="get">
        <label for="name">Your name</label>
        <div class="form-row">
          <input id="name" name="name" autocomplete="given-name" required maxlength="60">
          <button type="submit">Get greeting</button>
        </div>
      </form>
      <p id="greeting-result" role="status"></p>
    </main>
  </body>
</html>
